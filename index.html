<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>REVERSE CACHÉ RELOADED - GCBXGZR</title>
  <style>
    :root {
      --bg-radial-center: #3a3f47;
      --bg-radial-outer: #1c1e22;
      --accent-orange: #ff6600;
      --accent-orange-glow: rgba(255, 102, 0, 0.85);
      --fluor-cyan: #00f3ff;
      --fluor-cyan-glow: rgba(0, 243, 255, 0.75);
      --card-bg: rgba(24, 27, 32, 0.85);
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, var(--bg-radial-center) 0%, var(--bg-radial-outer) 100%);
      color: var(--text-main);
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: clamp(12px, 2.5vh, 20px) 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: clamp(2px, 1vh, 10px);
    }

    .multi-logo {
      width: clamp(70px, 13vh, 100px);
      height: clamp(70px, 13vh, 100px);
      object-fit: contain;
      filter: drop-shadow(0 0 2px #ff6600) drop-shadow(0 0 12px var(--accent-orange-glow));
      margin-bottom: clamp(4px, 1vh, 8px);
    }

    .title-main {
      font-size: clamp(1.2rem, 3.5vh, 1.6rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent-orange);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--accent-orange-glow);
      line-height: 1.1;
    }

    .title-sub {
      font-size: clamp(1.0rem, 3vh, 1.3rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent-orange);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-orange-glow);
      margin-top: 2px;
      line-height: 1.1;
    }

    .gc-code {
      font-size: clamp(0.95rem, 2.5vh, 1.15rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #f0f3f6;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
      margin-top: clamp(2px, 0.8vh, 6px);
    }

    .display-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--accent-orange);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: clamp(20px, 4vh, 32px) 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                  0 0 20px var(--accent-orange-glow),
                  inset 0 0 15px rgba(255, 102, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vh, 16px);
      margin: auto 0;
    }

    .label {
      font-size: clamp(0.95rem, 2.2vh, 1.1rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-orange);
      text-shadow: 0 0 8px var(--accent-orange-glow);
    }

    .value {
      font-size: clamp(2.8rem, 7vh, 3.8rem);
      font-weight: 900;
      color: var(--fluor-cyan);
      text-shadow: 0 0 18px var(--fluor-cyan-glow), 0 0 30px var(--fluor-cyan-glow);
      min-height: clamp(3.5rem, 8vh, 4.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-gps {
      font-size: clamp(0.8rem, 2vh, 0.95rem);
      font-weight: 600;
      color: #e2e8f0;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      gap: clamp(8px, 1.8vh, 14px);
      margin-bottom: clamp(2px, 1vh, 8px);
    }

    .btn-query {
      width: 100%;
      padding: clamp(14px, 2.2vh, 18px);
      font-size: clamp(1.1rem, 2.5vh, 1.25rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff7700 0%, #e65c00 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 25px var(--accent-orange-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-query:active {
      transform: scale(0.96);
      box-shadow: 0 0 40px var(--accent-orange);
    }

    footer {
      font-size: clamp(0.75rem, 1.8vh, 0.85rem);
      color: #a0aec0;
      letter-spacing: 1px;
    }

    footer a {
      color: var(--accent-orange);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 8px var(--accent-orange-glow);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img class="multi-logo" src="https://frangiga.github.io/reverse-cache-reloaded/Multi.png" alt="Multi Cache Logo">
      <div class="title-main">REVERSE CACHÉ</div>
      <div class="title-sub">RELOADED</div>
      <div class="gc-code">GCBXGZR</div>
    </header>

    <main class="display-card">
      <div class="label">DISTANCIA AL GZ</div>
      <div id="distancia-display" class="value">-- m</div>
      <div id="status-display" class="status-gps">Pulsa para consultar ubicación</div>
    </main>

    <div class="footer-section">
      <button id="btn-consultar" class="btn-query" onclick="obtenerUbicacionGPS()">Consultar Metros</button>
      <footer>
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>
  </div>

  <script>
    const LAT_INIT = 39.49970;
    const LON_INIT = -0.41990;
    const RADIO_JUEGO_METROS = 700;
    const PASO = 0.00005;

    function calcularHaversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function obtenerUbicacionGPS() {
      const status = document.getElementById("status-display");
      status.innerText = "Obteniendo GPS...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (posicion) => {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;
            procesarCoordenadas(lat, lon);
          },
          (error) => {
            status.innerText = "Error GPS: Activa la ubicación";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        status.innerText = "GPS no compatible.";
      }
    }

    function procesarCoordenadas(lat, lon) {
      const displayMetros = document.getElementById("distancia-display");
      const status = document.getElementById("status-display");

      const distAlOrigen = calcularHaversine(lat, lon, LAT_INIT, LON_INIT);

      if (distAlOrigen > RADIO_JUEGO_METROS) {
        displayMetros.innerText = "---";
        displayMetros.style.color = "#ff4444";
        status.innerText = "Fuera de la zona de juego (700m).";
        return;
      }

      const latGrid = Math.round(lat / PASO) * PASO;
      const lonGrid = Math.round(lon / PASO) * PASO;

      const latFinalGrid = 39.50015;
      const lonFinalGrid = -0.41575;
      
      const metros = calcularHaversine(latGrid, lonGrid, latFinalGrid, lonFinalGrid);

      if (metros <= 5) {
        displayMetros.innerText = "¡AQUÍ ES!";
        displayMetros.style.color = "#ff6600";
        status.innerText = "Has llegado al GZ final.";
      } else {
        displayMetros.innerText = `${metros} m`;
        displayMetros.style.color = "#00f3ff";
        status.innerText = "Ubicación confirmada.";
      }
    }
  </script>
</body>
</html>
