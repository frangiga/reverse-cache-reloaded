<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REVERSE CACHÉ RELOADED - GCBXGZR</title>
  <style>
    :root {
      --bg-radial-center: #3a3f47;
      --bg-radial-outer: #1c1e22;
      --accent-orange: #ff6600;
      --accent-orange-glow: rgba(255, 102, 0, 0.85);
      --fluor-cyan: #00f3ff;
      --fluor-cyan-glow: rgba(0, 243, 255, 0.75);
      --card-bg: rgba(24, 27, 32, 0.85);
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, var(--bg-radial-center) 0%, var(--bg-radial-outer) 100%);
      color: var(--text-main);
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 5px;
    }

    .multi-logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      filter: drop-shadow(0 0 2px #ff6600) drop-shadow(0 0 12px var(--accent-orange-glow));
      margin-bottom: 8px;
    }

    .title-main {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent-orange);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--accent-orange-glow);
      line-height: 1.1;
    }

    .title-sub {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent-orange);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-orange-glow);
      margin-top: 2px;
      line-height: 1.1;
    }

    .gc-code {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #f0f3f6;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
      margin-top: 6px;
    }

    .display-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--accent-orange);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                  0 0 20px var(--accent-orange-glow),
                  inset 0 0 15px rgba(255, 102, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .label {
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-orange);
      text-shadow: 0 0 8px var(--accent-orange-glow);
    }

    .value {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--fluor-cyan);
      text-shadow: 0 0 18px var(--fluor-cyan-glow), 0 0 30px var(--fluor-cyan-glow);
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-gps {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    .debug-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed #ff6600;
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #00f3ff;
      text-align: left;
      word-break: break-all;
      margin-top: 6px;
    }

    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      gap: 14px;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .btn-query {
      width: 100%;
      padding: 18px;
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff7700 0%, #e65c00 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 25px var(--accent-orange-glow);
      transition: all 0.2s ease;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .btn-query:active {
      transform: scale(0.96);
      box-shadow: 0 0 40px var(--accent-orange);
    }

    footer {
      font-size: 0.85rem;
      color: #a0aec0;
      letter-spacing: 1px;
    }

    footer a {
      color: var(--accent-orange);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 8px var(--accent-orange-glow);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img class="multi-logo" src="https://frangiga.github.io/reverse-cache-reloaded/Multi.png" alt="Multi Cache Logo">
      <div class="title-main">REVERSE CACHÉ</div>
      <div class="title-sub">RELOADED</div>
      <div class="gc-code">GCBXGZR</div>
    </header>

    <main class="display-card">
      <div class="label">Distancia al Final</div>
      <div id="distancia-display" class="value">-- m</div>
      <div id="status-display" class="status-gps">Pulsa para consultar ubicación</div>

      <div id="debug-info" class="debug-box">
        [Sistema] Esperando consulta de GPS...
      </div>
    </main>

    <div class="footer-section">
      <button id="btn-consultar" class="btn-query" onclick="obtenerUbicacionGPS()">Consultar Metros</button>
      <footer>
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>
  </div>

  <script>
    // Configuración del área del juego
    const LAT_INIT = 39.49970;
    const LON_INIT = -0.41990;
    const RADIO_JUEGO_METROS = 700;
    const PASO = 0.00005;

    // Distancia en metros usando fórmula Haversine
    function calcularHaversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    // Generador de Hash SHA-256 nativo
    async function generarSHA256(texto) {
      const msgBuffer = new TextEncoder().encode(texto);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function obtenerUbicacionGPS() {
      const status = document.getElementById("status-display");
      status.innerText = "Obteniendo GPS...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (posicion) => {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;
            await procesarCoordenadas(lat, lon);
          },
          (error) => {
            status.innerText = "Error GPS: " + error.message;
            document.getElementById("debug-info").innerHTML = `[ERROR GPS] Código ${error.code}: ${error.message}`;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        status.innerText = "GPS no compatible en este navegador.";
      }
    }

    async function procesarCoordenadas(lat, lon) {
      const displayMetros = document.getElementById("distancia-display");
      const status = document.getElementById("status-display");

      // Comprobar si está dentro del radio de 700m desde el origen
      const distAlOrigen = calcularHaversine(lat, lon, LAT_INIT, LON_INIT);

      // Mapeo a la rejilla alineada
      const latGrid = (Math.round(lat / PASO) * PASO).toFixed(5);
      const lonGrid = (Math.round(lon / PASO) * PASO).toFixed(5);
      const celdaStr = `${latGrid},${lonGrid}`;
      const hashCelda = await generarSHA256(celdaStr);

      if (distAlOrigen > RADIO_JUEGO_METROS) {
        displayMetros.innerText = "---";
        displayMetros.style.color = "#ff4444";
        status.innerText = "Fuera de la zona de juego (700m).";
        
        document.getElementById("debug-info").innerHTML = 
          `<b>GPS Real:</b> ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>` +
          `<b>Celda Grid:</b> ${celdaStr}<br>` +
          `<b>Hash SHA-256:</b> ${hashCelda.substring(0, 12)}...<br>` +
          `<b>Dist. Origen:</b> ${distAlOrigen} m (Límite: ${RADIO_JUEGO_METROS}m)`;
        return;
      }

      // Calcular distancia en tiempo real respecto al objetivo
      // Las coordenadas finales están representadas internamente por la celda de convergencia
      const latFinalGrid = 39.50015;
      const lonFinalGrid = -0.41575;
      
      const metros = calcularHaversine(parseFloat(latGrid), parseFloat(lonGrid), latFinalGrid, lonFinalGrid);

      document.getElementById("debug-info").innerHTML = 
        `<b>GPS Real:</b> ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>` +
        `<b>Celda Grid:</b> ${celdaStr}<br>` +
        `<b>Hash SHA-256:</b> ${hashCelda.substring(0, 12)}...<br>` +
        `<b>Zona de juego:</b> OK (${distAlOrigen}m del origen)`;

      if (metros <= 5) {
        displayMetros.innerText = "¡AQUÍ ES!";
        displayMetros.style.color = "#ff6600";
        status.innerText = "Has llegado al destino final.";
      } else {
        displayMetros.innerText = `${metros} m`;
        displayMetros.style.color = "#00f3ff";
        status.innerText = "Ubicación confirmada.";
      }
    }
  </script>
</body>
</html>
