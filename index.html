<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REVERSE CACHÉ RELOADED - GCBXGZR</title>
  <style>
    :root {
      --bg-radial-center: #2a2d32;
      --bg-radial-outer: #0a0b0d;
      --accent-yellow: #ffee00;
      --accent-yellow-glow: rgba(255, 238, 0, 0.8);
      --fluor-cyan: #00f3ff;
      --fluor-cyan-glow: rgba(0, 243, 255, 0.7);
      --card-bg: #141619;
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, var(--bg-radial-center) 0%, var(--bg-radial-outer) 100%);
      color: var(--text-main);
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 16px 16px 20px 16px;
    }

    /* Cabecera Reestructurada */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 5px;
    }

    .multi-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px var(--accent-yellow-glow));
      margin-bottom: 8px;
    }

    .title-main {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent-yellow);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-yellow-glow);
      line-height: 1.1;
    }

    .title-sub {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent-yellow);
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--accent-yellow-glow);
      margin-top: 2px;
      line-height: 1.1;
    }

    .gc-code {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--text-main);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      margin-top: 6px;
    }

    /* Panel de Consulta */
    .display-card {
      background: var(--card-bg);
      border: 3px solid var(--accent-yellow);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 
                  0 0 15px var(--accent-yellow-glow),
                  inset 0 0 20px var(--accent-yellow-glow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .label {
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-yellow);
      text-shadow: 0 0 8px var(--accent-yellow-glow);
    }

    .value {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--fluor-cyan);
      text-shadow: 0 0 18px var(--fluor-cyan-glow), 0 0 30px var(--fluor-cyan-glow);
      min-height: 4.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-gps {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e0e0e0;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    /* Botón e Interfaz Inferior */
    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      gap: 14px;
      margin-bottom: 5px;
    }

    .btn-query {
      width: 100%;
      padding: 18px;
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #000;
      background: var(--accent-yellow);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 25px var(--accent-yellow-glow);
      transition: all 0.2s ease;
    }

    .btn-query:active {
      transform: scale(0.96);
      box-shadow: 0 0 40px var(--accent-yellow);
    }

    .btn-query.loading {
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 15px var(--accent-yellow-glow);
      }
      100% {
        box-shadow: 0 0 35px var(--fluor-cyan), 0 0 20px var(--accent-yellow);
      }
    }

    /* Footer con créditos */
    footer {
      font-size: 0.85rem;
      color: #999;
      letter-spacing: 1px;
    }

    footer a {
      color: var(--accent-yellow);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 6px var(--accent-yellow-glow);
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--fluor-cyan);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img class="multi-logo" src="https://frangiga.github.io/reverse-cache-reloaded/Multi.png" alt="Multi Cache Logo">
      <div class="title-main">REVERSE CACHÉ</div>
      <div class="title-sub">RELOADED</div>
      <div class="gc-code">GCBXGZR</div>
    </header>

    <main class="display-card">
      <div class="label">Distancia al Final</div>
      <div id="distancia-display" class="value">-- m</div>
      <div id="status-display" class="status-gps">GPS preparado</div>
    </main>

    <div class="footer-section">
      <button id="btn-consultar" class="btn-query" onclick="obtenerUbicacionGPS()">Consultar Metros</button>
      <footer>
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>
  </div>

  <script>
    let mapaDistancias = {};

    fetch('distancias.json')
      .then(res => res.json())
      .then(data => {
        mapaDistancias = data;
        document.getElementById("status-display").innerText = "Base de datos lista.";
      })
      .catch(err => {
        document.getElementById("status-display").innerText = "Error cargando archivo JSON.";
      });

    async function generarSHA256(texto) {
      const msgBuffer = new TextEncoder().encode(texto);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function obtenerUbicacionGPS() {
      const btn = document.getElementById("btn-consultar");
      const status = document.getElementById("status-display");

      btn.classList.add("loading");
      status.innerText = "Obteniendo señal GPS...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (posicion) => {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;
            await procesarCoordenadas(lat, lon);
            btn.classList.remove("loading");
          },
          (error) => {
            btn.classList.remove("loading");
            status.innerText = "Error: Activa la ubicación GPS.";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        btn.classList.remove("loading");
        status.innerText = "Navegador no compatible con GPS.";
      }
    }

    async function procesarCoordenadas(lat, lon) {
      const celdaStr = `${lat.toFixed(5)},${lon.toFixed(5)}`;
      const hashCelda = await generarSHA256(celdaStr);
      const displayMetros = document.getElementById("distancia-display");
      const status = document.getElementById("status-display");

      if (hashCelda in mapaDistancias) {
        const metros = mapaDistancias[hashCelda];
        
        if (metros <= 3) {
          displayMetros.innerText = "¡AQUÍ ES!";
          displayMetros.style.color = "#ffee00";
          status.innerText = "Has llegado al destino final.";
        } else {
          displayMetros.innerText = `${metros} m`;
          displayMetros.style.color = "#00f3ff";
          status.innerText = "Ubicación confirmada.";
        }
      } else {
        displayMetros.innerText = "---";
        displayMetros.style.color = "#ff4444";
        status.innerText = "Fuera de la zona de juego (700m).";
      }
    }
  </script>
</body>
</html>
