<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>REVERSE CACHÉ RELOADED - GCBXGZR</title>
  <style>
    :root {
      --bg-radial-center: #323740;
      --bg-radial-outer: #16181c;
      --accent-orange: #ff7700;
      --accent-orange-light: #ff9933;
      --accent-orange-glow: rgba(255, 119, 0, 0.45);
      --fluor-cyan: #00f3ff;
      --fluor-cyan-glow: rgba(0, 243, 255, 0.6);
      --card-bg: rgba(20, 23, 28, 0.85);
      --text-main: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, var(--bg-radial-center) 0%, var(--bg-radial-outer) 100%);
      color: var(--text-main);
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: clamp(12px, 2.5vh, 20px) 16px;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: clamp(2px, 1vh, 10px);
    }
    .multi-logo {
      width: clamp(70px, 13vh, 100px);
      height: clamp(70px, 13vh, 100px);
      object-fit: contain;
      margin-bottom: clamp(4px, 1vh, 8px);
      -webkit-mask-image: radial-gradient(circle at center, black 38%, rgba(0,0,0,0.85) 45%, transparent 49.5%);
      mask-image: radial-gradient(circle at center, black 38%, rgba(0,0,0,0.85) 45%, transparent 49.5%);
      filter: drop-shadow(0 0 8px var(--accent-orange-glow));
    }
    .title-main {
      font-size: clamp(1.2rem, 3.2vh, 1.5rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent-orange);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-orange-glow);
      line-height: 1.1;
    }
    .title-sub {
      font-size: clamp(0.95rem, 2.6vh, 1.2rem);
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--accent-orange);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-orange-glow);
      margin-top: 3px;
      line-height: 1.1;
      opacity: 0.95;
    }
    .gc-code {
      font-size: clamp(1.2rem, 3vh, 1.42rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #d1d5db;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
      margin-top: clamp(4px, 1vh, 8px);
    }
    .display-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 119, 0, 0.6);
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      padding: clamp(20px, 3.8vh, 30px) 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 15px var(--accent-orange-glow), inset 0 0 12px rgba(255, 119, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vh, 16px);
      margin: auto 0;
    }
    .label {
      font-size: clamp(0.85rem, 2vh, 1rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent-orange-light);
      text-shadow: 0 0 6px var(--accent-orange-glow);
    }
    .value {
      font-size: clamp(2.8rem, 7vh, 3.8rem);
      font-weight: 800;
      color: var(--fluor-cyan);
      text-shadow: 0 0 14px var(--fluor-cyan-glow), 0 0 28px var(--fluor-cyan-glow);
      min-height: clamp(3.5rem, 8vh, 4.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }
    .status-gps {
      font-size: clamp(0.8rem, 1.8vh, 0.9rem);
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 350px;
      gap: clamp(8px, 1.8vh, 14px);
      margin-bottom: clamp(2px, 1vh, 8px);
    }
    .btn-query {
      width: 100%;
      padding: clamp(14px, 2vh, 17px);
      font-size: clamp(1rem, 2.3vh, 1.15rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff8800 0%, #d95500 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 6px 20px var(--accent-orange-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-query:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px var(--accent-orange-glow);
    }
    footer {
      font-size: clamp(0.75rem, 1.6vh, 0.82rem);
      color: #64748b;
      letter-spacing: 1px;
    }
    footer a {
      color: var(--accent-orange-light);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    footer a:hover {
      color: var(--fluor-cyan);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img class="multi-logo" src="https://frangiga.github.io/reverse-cache-reloaded/Multi.png" alt="Multi Cache Logo">
      <div class="title-main">REVERSE CACHÉ</div>
      <div class="title-sub">RELOADED</div>
      <div class="gc-code">GCBXGZR</div>
    </header>

    <main class="display-card">
      <div class="label">DISTANCIA AL GZ</div>
      <div id="distancia-display" class="value">-- m</div>
      <div id="status-display" class="status-gps">Pulsa para consultar ubicación</div>
    </main>

    <div class="footer-section">
      <button id="btn-consultar" class="btn-query" onclick="obtenerUbicacionGPS()">Consultar Metros</button>
      <footer>Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a></footer>
    </div>
  </div>

  <script>
    // Coordenadas del centro del campo de juego: N 39° 29.982 W 000° 25.194
    const LAT_CENTRO = 39.49970;
    const LON_CENTRO = -0.41990;
    
    // Distancia máxima requerida para iniciar el juego (20 metros)
    const RADIO_INICIO_METROS = 20;
    
    const PASO = 0.00005;
    let juegoIniciado = false;

    function calcularHaversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function obtenerUbicacionGPS() {
      const status = document.getElementById("status-display");
      status.innerText = "Obteniendo GPS...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((posicion) => {
          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;
          procesarCoordenadas(lat, lon);
        }, (error) => {
          status.innerText = "Error GPS: Activa la ubicación";
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      } else {
        status.innerText = "GPS no compatible.";
      }
    }

    function procesarCoordenadas(lat, lon) {
      const displayMetros = document.getElementById("distancia-display");
      const status = document.getElementById("status-display");

      // Verificar la distancia con respecto al centro del campo de juego
      const distAlCentro = calcularHaversine(lat, lon, LAT_CENTRO, LON_CENTRO);

      // Si aún no ha iniciado el juego, validar que esté dentro del radio de 20m
      if (!juegoIniciado) {
        if (distAlCentro > RADIO_INICIO_METROS) {
          displayMetros.innerText = "---";
          displayMetros.style.color = "#ff4444";
          status.innerText = `Fuera de la zona de inicio (${distAlCentro}m del centro. Máximo 20m).`;
          return;
        } else {
          juegoIniciado = true;
        }
      }

      // Si ya está dentro de la zona de inicio, calcular distancia al GZ final
      const latGrid = Math.round(lat / PASO) * PASO;
      const lonGrid = Math.round(lon / PASO) * PASO;
      const latFinalGrid = 39.50015;
      const lonFinalGrid = -0.41575;

      const metros = calcularHaversine(latGrid, lonGrid, latFinalGrid, lonFinalGrid);

      if (metros <= 5) {
        displayMetros.innerText = "¡AQUÍ ES!";
        displayMetros.style.color = "#ff7700";
        status.innerText = "Has llegado al GZ final.";
      } else {
        displayMetros.innerText = `${metros} m`;
        displayMetros.style.color = "#00f3ff";
        status.innerText = "Ubicación confirmada.";
      }
    }
  </script>
</body>
</html>
